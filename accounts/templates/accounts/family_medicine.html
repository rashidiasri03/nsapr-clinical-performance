{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Family Medicine - NSAPR</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Pautan CSS yang sama dengan General Surgery -->
  <link rel="stylesheet" href="{% static 'css/general_surgery.css' %}">
</head>
<body>
  
  <div class="container main-content">
    
    <!-- Top Blue Header -->
    <div class="header-banner d-flex justify-content-between align-items-center">
      <h2 class="mb-0">Family Medicine</h2>
      <span class="fs-6 opacity-75">Performance & Activity Overview</span>
    </div>

    <!-- Cards Container -->
    <div class="cards-container">
      
      <!-- Activities Card -->
      <a href="{% url 'family_medicine_activities' %}" class="custom-card text-decoration-none">
        <div class="icon-circle icon-activities">
          <!-- Ikon SVG Activities -->
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-clipboard2-check" viewBox="0 0 16 16">
            <path d="M9.5 0a.5.5 0 0 1 .5.5.5.5 0 0 0 .5.5.5.5 0 0 1 .5.5V2a.5.5 0 0 1-.5.5h-5A.5.5 0 0 1 5 2v-.5a.5.5 0 0 1 .5-.5.5.5 0 0 0 .5-.5.5.5 0 0 1 .5-.5h3Z"/>
            <path d="M3 2.5a.5.5 0 0 1 .5-.5H4a.5.5 0 0 0 0-1h-.5A1.5 1.5 0 0 0 2 2.5v12A1.5 1.5 0 0 0 3.5 16h9a1.5 1.5 0 0 0 1.5-1.5v-12A1.5 1.5 0 0 0 12.5 1H12a.5.5 0 0 0 0 1h.5a.5.5 0 0 1 .5.5v12a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5v-12Z"/>
            <path d="M10.854 7.854a.5.5 0 0 0-.708-.708L7.5 9.793 6.354 8.646a.5.5 0 1 0-.708.708l1.5 1.5a.5.5 0 0 0 .708 0l3-3Z"/>
          </svg>
        </div>
        <div class="card-text-container text-dark">
          <h4 class="card-title">Activities</h4>
          <p class="card-subtitle text-muted">View & manage activities</p>
        </div>
      </a>

      <!-- Dashboard Card -->
      <a href="{% url 'dashboard_family_medicine' %}" class="custom-card text-decoration-none">
        <div class="icon-circle icon-dashboard">
          <!-- Ikon SVG Dashboard -->
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-speedometer2" viewBox="0 0 16 16">
            <path d="M8 4a.5.5 0 0 1 .5.5V6a.5.5 0 0 1-1 0V4.5A.5.5 0 0 1 8 4zM3.732 5.732a.5.5 0 0 1 .707 0l.915.914a.5.5 0 1 1-.708.708l-.914-.915a.5.5 0 0 1 0-.707zM2 10a.5.5 0 0 1 .5-.5h1.586a.5.5 0 0 1 0 1H2.5A.5.5 0 0 1 2 10zm9.5 0a.5.5 0 0 1 .5-.5h1.5a.5.5 0 0 1 0 1H12a.5.5 0 0 1-.5-.5zm.754-4.246a.389.389 0 0 0-.527-.02L7.547 9.31a.91.91 0 1 0 1.302 1.258l3.434-4.297a.389.389 0 0 0-.029-.518z"/>
            <path fill-rule="evenodd" d="M0 10a8 8 0 1 1 15.547 2.661c-.442 1.253-1.845 2.508-3.955 2.508H4.408c-2.11 0-3.513-1.255-3.955-2.508A8.001 8.001 0 0 1 0 10zm8-7a7 7 0 0 0-6.603 9.329c.203.575.923 1.171 3.011 1.171h7.184c2.088 0 2.808-.596 3.011-1.171A7 7 0 0 0 8 3z"/>
          </svg>
        </div>
        <div class="card-text-container text-dark">
          <h4 class="card-title">Dashboard</h4>
          <p class="card-subtitle text-muted">Clinical performance & indicators</p>
        </div>
      </a>

    </div>

    <!-- Back Button -->
    <div class="text-center mt-5">
      <a href="{% url 'fraternity' %}" class="back-link text-decoration-none">← Back to Fraternity</a>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
